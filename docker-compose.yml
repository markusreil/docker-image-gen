# local-image-ai — local AI image-generation stack
#
# Phase 1: InvokeAI WebUI + an OpenAI-compatible bridge for agents.
# ComfyUI is anticipated (dedicated model volumes, network alias pattern,
# nvidia/amd profile pattern) but not part of this compose file yet.
#
# No `ports:` anywhere: every public endpoint is owned by the external
# reverse-proxy cluster. Start that cluster first (see README.md).

name: local-image-ai

# Hostnames anchored once; change BASE_DOMAIN and the whole stack moves.
x-hosts:
  invokeai: &host-invokeai invokeai.${BASE_DOMAIN}
  invokeai-url: &host-invokeai-url https://invokeai.${BASE_DOMAIN}
  bridge: &host-bridge images.${BASE_DOMAIN}
  bridge-url: &host-bridge-url https://images.${BASE_DOMAIN}

# Environment shared by the NVIDIA and AMD InvokeAI variants. It is kept in a
# separate anchor so each variant can add its own keys via a YAML merge without
# replacing the shared ones.
x-invokeai-env: &invokeai-env
  INVOKEAI_ROOT: /invokeai
  # Models live on a dedicated volume OUTSIDE INVOKEAI_ROOT, so the
  # entrypoint's recursive chown never walks the model store, and the pool
  # can later be mounted read-only into ComfyUI.
  INVOKEAI_MODELS_DIR: /models
  INVOKEAI_HOST: 0.0.0.0
  INVOKEAI_PORT: "9090"
  # UID the image's entrypoint assigns to its runtime user before dropping
  # privileges. Must match PUID, which owns the model volume.
  CONTAINER_UID: ${PUID:-1000}
  # Full downstream proxy contract — the proxy variant decides what applies.
  VIRTUAL_HOST: *host-invokeai
  VIRTUAL_PORT: "9090"
  ACME_HOST: *host-invokeai
  GEN_SELF_SIGNED_CERT: ${INVOKEAI_GEN_SELF_SIGNED_CERT:-false}

# Everything common to the NVIDIA and AMD InvokeAI variants except the image,
# the environment (see above) and the GPU wiring.
x-invokeai-common: &invokeai-common
  restart: unless-stopped
  # `expose` (not `ports`): reachable only through the proxy network.
  expose:
    - "9090"
  volumes:
    - invokeai-root:/invokeai
    # InvokeAI's managed model store (single writer). The future ComfyUI will
    # read this read-only; it is NOT the ComfyUI-canonical `ai-models` volume.
    - invokeai-models:/models
  networks:
    internal:
      aliases:
        - invokeai
    web-proxy: {}
  # Prepare the model volume ownership and the persistent MIOpen cache directory
  # before InvokeAI starts (see invokeai-init).
  depends_on:
    invokeai-init:
      condition: service_completed_successfully
  labels:
    homepage.group: AI
    homepage.name: InvokeAI
    homepage.icon: invokeai
    homepage.href: *host-invokeai-url
    homepage.description: Local AI image-generation WebUI

services:
  # One-shot seeding of ComfyUI's own model volume. Creates the
  # ComfyUI-canonical directory layout so the later ComfyUI service has a
  # ready download target. InvokeAI does NOT use this volume.
  # Only the top level is chowned (NON-recursive): files created later inherit
  # ownership from the running user, and a recursive chown would be slow here.
  models-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ai-models:/models
    networks:
      - internal
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /models/checkpoints /models/diffusion_models /models/unet
        /models/loras /models/vae /models/clip /models/text_encoders
        /models/controlnet /models/upscale_models /models/embeddings &&
        chown ${PUID:-1000}:${PGID:-1000} /models /models/*

  # One-shot preparation for InvokeAI:
  #  - chowns the top level of the invokeai-models volume. The upstream
  #    entrypoint only chowns INVOKEAI_ROOT (/invokeai) before dropping to its
  #    runtime user, leaving /models root-owned, so startup then fails creating
  #    /models/model_images. NON-recursive: the store is large.
  #  - creates the MIOpen kernel/find-db directory. Consumer gfx1151 ships no
  #    prebuilt kernel DB and MIOpen does not create the directory itself, so
  #    without this every restart recompiles convolution kernels from source
  #    (minutes). See the MIOPEN_* variables on the AMD service.
  invokeai-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - invokeai-root:/invokeai
      - invokeai-models:/models
    networks:
      - internal
    entrypoint:
      - /bin/sh
      - -c
      - >
        chown ${PUID:-1000}:${PGID:-1000} /models &&
        mkdir -p /invokeai/.miopen &&
        chown ${PUID:-1000}:${PGID:-1000} /invokeai/.miopen

  invokeai-nvidia:
    <<: *invokeai-common
    profiles: [nvidia]
    image: ${INVOKEAI_IMAGE_CUDA:?}
    # Use the registered NVIDIA runtime explicitly (with NVIDIA_VISIBLE_DEVICES
    # set, since an unset/empty value makes the runtime behave like plain runc).
    # This is deliberate: the Compose `deploy.resources.reservations.devices`
    # form maps to the Docker `--gpus`/device-request path, which on some hosts
    # (observed with an RTX 5090 + driver 615 + nvidia-open) injects the device
    # nodes but leaves CUDA unable to initialize (`cuInit` -> CUDA_ERROR_UNKNOWN
    # / "CUDA unknown error"). The explicit runtime path initializes CUDA
    # correctly. Requires `nvidia-ctk runtime configure --runtime=docker`.
    runtime: nvidia
    environment:
      <<: *invokeai-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  invokeai-amd:
    <<: *invokeai-common
    profiles: [amd]
    # Locally built thin derivative of the upstream InvokeAI ROCm image that
    # swaps in PyTorch's ROCm 7.2 torch wheels: ROCm 7.1 segfaults on gfx1151
    # (Strix Halo). See invokeai-rocm/Dockerfile and README "AMD / ROCm".
    build:
      context: ./invokeai-rocm
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: local-image-ai/invokeai-rocm:${INVOKEAI_ROCM_VERSION:?}
    environment:
      <<: *invokeai-env
      # gfx1151 / Strix Halo tuning.
      # ROCm SDPA falls back to the very slow math path without this; flash
      # attention is unavailable on gfx1151, so this selects the AOTriton
      # mem-efficient path. The cache keeps its autotuning across restarts.
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      TORCH_ROCM_AOTRITON_ENABLE_CACHE: "1"
      # hipBLASLt beats rocBLAS on gfx1151 inference GEMMs (10-34% in matmul
      # sweeps). Verify with torch.backends.cuda.preferred_blas_library().
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      # SDMA is unreliable on APUs (VAE hangs); costs ~nothing on unified memory.
      HSA_ENABLE_SDMA: "0"
      # Consumer gfx1151 ships no prebuilt MIOpen kernel DB, so the find-db and
      # compiled kernels MUST live on a persistent path or every start re-tunes /
      # recompiles conv shapes from source (minutes). invokeai-init creates it.
      MIOPEN_FIND_MODE: HYBRID
      MIOPEN_USER_DB_PATH: /invokeai/.miopen
      MIOPEN_CUSTOM_CACHE_DIR: /invokeai/.miopen
      # HIP allocator (the CUDA var is ignored on ROCm builds).
      # expandable_segments is NOT supported on this ROCm build.
      PYTORCH_HIP_ALLOC_CONF: garbage_collection_threshold:0.8,max_split_size_mb:512
    # AMD ROCm wiring. If the GPU is not recognised, add and pin the
    # architecture explicitly, e.g. HSA_OVERRIDE_GFX_VERSION: "10.3.0".
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    shm_size: 8g

  # OpenAI-compatible bridge for agents. Always on (no profile): it starts
  # regardless of which InvokeAI variant is active and depends on both with
  # `required: false` so the inactive profile does not block it.
  openai-bridge:
    build:
      context: ./openai-bridge
      args:
        GO_VERSION: ${BRIDGE_GO_VERSION:-1.26.3}
        BRIDGE_VERSION: ${BRIDGE_VERSION:?}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: local-image-ai/openai-bridge:${BRIDGE_VERSION:?}
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      invokeai-nvidia:
        condition: service_started
        required: false
      invokeai-amd:
        condition: service_started
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PROXY_LISTEN_IP: 0.0.0.0
      PROXY_PORT: "8080"
      INVOKE_URL: http://invokeai:9090
      PROXY_DATA_DIR: /data
      PROXY_API_KEY: ${BRIDGE_API_KEY:?}
      PROXY_ADMIN_USER: ${BRIDGE_ADMIN_USER:?}
      PROXY_ADMIN_PASS: ${BRIDGE_ADMIN_PASS:?}
      PROXY_TIMEOUT: ${BRIDGE_TIMEOUT:-300s}
      PROXY_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-info}
      # Cap (seconds) on the first-run wait for InvokeAI model discovery.
      BRIDGE_MODEL_WAIT_SECONDS: ${BRIDGE_MODEL_WAIT_SECONDS:-180}
      # Full downstream proxy contract.
      VIRTUAL_HOST: *host-bridge
      VIRTUAL_PORT: "8080"
      ACME_HOST: *host-bridge
      GEN_SELF_SIGNED_CERT: ${BRIDGE_GEN_SELF_SIGNED_CERT:-false}
    volumes:
      - bridge-data:/data
    networks:
      - internal
      - web-proxy
    labels:
      homepage.group: AI
      homepage.name: OpenAI Bridge
      homepage.icon: openai
      homepage.href: *host-bridge-url
      homepage.description: OpenAI-compatible API bridge to InvokeAI

networks:
  # Private network for service-to-service traffic (bridge -> invokeai).
  internal:
    driver: bridge
  # Owned by the external proxy cluster: same name, external, started first.
  web-proxy:
    name: ${NGINX_PROXY_NETWORK:-web-proxy}
    external: true

volumes:
  invokeai-root:
  # InvokeAI-managed model store; single writer, read-only for ComfyUI later.
  invokeai-models:
  # ComfyUI's own canonical download store (seeded by models-init).
  ai-models:
  bridge-data:
